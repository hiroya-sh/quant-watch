# 量子化ウォッチ用タグ辞書
# - 表記揺れを防ぐためのcanonical形式
# - Routine はこの辞書のいずれかに該当するタグでアイテムを分類
# - 既存にないタグが出現したら、weekly末尾の「新規タグ候補」に列挙される → 手動でここに追加

# モデル: HF形式 (org/name)
# Routine は substring match で適用(例: "google/gemma-4" は "google/gemma-4-26b-a4b" にもヒット)
models:
  # Meta
  - meta-llama/Llama-3.1
  - meta-llama/Llama-3.2
  - meta-llama/Llama-3.3
  - meta-llama/Llama-4-Scout
  - meta-llama/Llama-4
  # Google
  - google/gemma-3
  - google/gemma-4
  # Alibaba
  - Qwen/Qwen2.5
  - Qwen/Qwen3
  - Qwen/Qwen3.5
  - Qwen/Qwen3.6
  # DeepSeek
  - deepseek-ai/DeepSeek-V3
  - deepseek-ai/DeepSeek-V4
  - deepseek-ai/DeepSeek-R1
  # Moonshot
  - moonshotai/Kimi-K2.5
  - moonshotai/Kimi-K2.6
  - moonshotai/Kimi-K2.7
  # Zhipu
  - zai-org/GLM-5.1
  # Mistral
  - mistralai/Mistral
  - mistralai/Mixtral
  - mistralai/Mistral-Medium-3.5
  - mistralai/Devstral
  # Microsoft
  - microsoft/Phi-4
  - microsoft/Phi-4-mini
  # NVIDIA
  - nvidia/Nemotron-Cascade-2
  - nvidia/Nemotron
  # MiniMax
  - MiniMaxAI/MiniMax-M2.7
  - MiniMaxAI/MiniMax-M3

# アーキテクチャ: lowercase
# 1つのモデルが複数該当することあり(例: Nemotron-H = hybrid + mamba + transformer)
architectures:
  - transformer
  - mamba
  - mamba2
  - state-space-model
  - linear-attention
  - gla              # Gated Linear Attention
  - rwkv
  - hybrid           # Mamba+Transformer等
  - moe              # アーキテクチャとしてのMoE
  - dense
  - lfm              # Liquid Functional Model (LiquidAI LFM系)

# 量子化手法: 大文字優先
methods:
  # 古典PTQ
  - GPTQ
  - AWQ
  - SmoothQuant
  - QuIP
  - OmniQuant
  - LLM.int8
  - bitsandbytes
  # Rotationベース
  - SpinQuant
  - QuaRot
  - FPTQuant
  # ハッシュ/直交変換
  - HQQ
  - QJL
  - PolarQuant
  - TurboQuant
  # FP低ビット
  - LLM-FP4
  - NVFP4            # NVIDIA Blackwell native FP4
  - MXFP4
  - MXFP6
  - MixFP4           # NVFP4拡張 (E2M1/E1M2適応選択)
  - ROCmFP4          # AMD ROCm向けFP4フォーマット
  - NF4
  # ビット割当
  - AutoRound
  - BAQ
  - MoQAE
  # KV量子化系
  - KVQuant
  - QAQ
  # フォーマット
  - GGUF
  - EXL2
  - EXL3
  # その他PTQ/QAT手法 (W24-25 追加)
  - CKA-QAD          # NVFP4蒸留の表現幾何保全 (QAD)
  - Qift             # No-Zero W2レベルセット + KV4量子化
  - SAGE-PTQ         # スケールオーバーヘッド最小化の超低ビットPTQ
  - OptiQ            # Apple Silicon MLX向け4-bit量子化
  # W28 タグ候補は 2026-07-07 の一次情報検証で【全て捏造論文由来】と判明したため撤回。
  #   TurboQuant-Ω / PolarAct / TernaryPack / VLA-Q3 / DiffLLM-Q / Router-Aware-QAT /
  #   KV-Evict-Q / SpecuMoE-Q / KV-Codex は、対応する arxiv 論文が存在しない(別分野の論文か未登録)。
  #   実在する基盤手法(TurboQuant / PolarQuant / QJL / KVQuant)は上に既登録済み。

# 技術要素: kebab-case
tech:
  # 量子化対象
  - weight-only
  - activation-quant
  - kv-cache-quant
  - full-quant
  # ビット深度
  - low-bit-fp8
  - hif8                      # High-quality FP8 (FP8産業標準化名称)
  - low-bit-fp6
  - low-bit-fp4
  - low-bit-4
  - low-bit-3
  - low-bit-2
  - low-bit-1bit
  - mixed-precision
  # 手法カテゴリ
  - ptq
  - qat
  - calibration
  - calibration-free
  - rotation
  - polar-rotation
  - qjl-correction
  - outlier-handling
  - variance-normalization    # 分散正規化 (KVarN, Hadamard併用のKV誤差削減)
  - block-wise
  - per-channel
  - per-token
  - microscaling-formats
  # 構造特化
  - moe-quant
  - long-context-quant
  - pre-rope-quant
  - vla-quant                 # Vision-Language-Action モデルへの量子化
  - diffusion-llm-quant       # 拡散LLM (非自己回帰) への量子化
  # 関連技術(量子化外だが文脈で出る)
  - speculative-decoding
  - paged-attention
  - kv-cache-eviction
  - kv-cache-compression-non-quant
  - latent-compaction
  - reasoning-aware-compression
  - sparse-attention                # 注意スパース化によるKV計算削減
  - lossless-compression            # 精度劣化なしのGPUメモリ圧縮 (IBP等)
  - lossless-quantization-recovery  # 量子化後の精度回復 (Recover-LoRA等)
  # step-conditioned-quantization / router-side-qat / unified-kv-benchmark は
  #   由来アイテム(W28-005/010/003)が捏造と判明したため 2026-07-07 に撤回。
  # 運用タグ: エンジン実装状況 (2026-07-07 監視方針で追加)
  - vllm-ready                      # vLLM でロード/実行可能(native統合 or 量子化済みモデル配布)
  - trtllm-ready                    # TensorRT-LLM 実装あり
  - llamacpp-ready                  # llama.cpp / GGUF で実行可能
